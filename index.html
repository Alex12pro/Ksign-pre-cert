<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ksign — install</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at top, #14141a 0%, transparent 60%), #0a0a0c;
    color: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 420px;
    background: #121216; border: 1px solid #232329;
    border-radius: 16px; padding: 36px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .icon {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 28px; font-weight: 700; color: #fff;
  }
  h1 { text-align: center; font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  p.sub { text-align: center; color: #8a8a94; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

  a.btn {
    display: block; text-align: center;
    padding: 16px; border-radius: 10px;
    color: #fff; text-decoration: none;
    font-weight: 600; font-size: 15px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; user-select: none;
    pointer-events: auto; position: relative; z-index: 2;
  }
  a.btn:active { filter: brightness(1.15); }

  a.install {
    background: #4f7cff;
    margin-bottom: 12px;
  }
  a.dns {
    background: #2a2a32;
    border: 1px solid #3a3a44;
    margin-bottom: 12px;
  }
  a.certs {
    background: #2a2a32;
    border: 1px solid #3a3a44;
    margin-bottom: 20px;
  }

  p.warn { text-align: center; font-size: 11px; color: #f5a623; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">k</div>
    <h1>ksign</h1>
    <p class="sub">Install the signed app on this iPhone.</p>

    <a class="btn install" href="itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/Alex12pro/Ksign-pre-cert/main/ksign.plist">Install ksign</a>

    <a class="btn dns" href="https://wsfteam.xyz/files/configurationprofiles/cfdns-cp56.mobileconfig">Install Anti Revoke DNS</a>

    <a class="btn certs" href="https://raw.githubusercontent.com/Alex12pro/Ksign-pre-cert/main/HSBC%20Bank%20plc.zip">Install Ksign Cert Files</a>

    <p class="warn">Open in Safari. Install and use DNS before anything, toggle "CFDNS + install only", on the dns options. Once ksign installs import the cert files into ksign to start using.</p>
  </div>
</body>
</html>
