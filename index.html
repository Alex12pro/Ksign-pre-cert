<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ksign — install</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a0c;
    color: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(ellipse at top, #14141a 0%, transparent 60%),
      #0a0a0c;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #121216;
    border: 1px solid #232329;
    border-radius: 16px;
    padding: 36px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 0 0 8px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  p.sub {
    text-align: center;
    color: #8a8a94;
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  a.install {
    display: block;
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    background: #4f7cff;
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    pointer-events: auto;
    position: relative;
    z-index: 2;
  }
  a.install:active {
    background: #6a92ff;
  }
  p.warn {
    text-align: center;
    font-size: 11px;
    color: #f5a623;
    margin-top: 20px;
    line-height: 1.5;
  }
  p.fallback {
    text-align: center;
    font-size: 11px;
    color: #8a8a94;
    margin-top: 14px;
    line-height: 1.5;
  }
  p.fallback a {
    color: #4f7cff;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">k</div>
    <h1>ksign</h1>
    <p class="sub">Install the signed app on this iPhone.</p>

    <a class="install" href="itms-services://?action=download-manifest&url=https://YOUR-SITE.netlify.app/ksign.plist">Install ksign</a>

    <p class="warn">Open in Safari. Chrome/Firefox cannot install iOS apps.</p>
    <p class="fallback">
      Button not working? <a id="direct" href="itms-services://?action=download-manifest&url=https://YOUR-SITE.netlify.app/ksign.plist">Tap here to install directly</a>.
    </p>
  </div>

  <script>
    // Belt-and-suspenders: if the anchor's href got sanitized anywhere in the
    // pipeline, force-assign the correct itms-services URL at runtime.
    (function () {
      var PLIST_URL = "https://ksigncertinstall.netlify.app/ksign.plist";
      var target = "itms-services://?action=download-manifest&url=" + PLIST_URL;
      var links = document.querySelectorAll('a.install, a#direct');
      for (var i = 0; i < links.length; i++) {
        links[i].setAttribute('href', target);
      }
    })();
  </script>
</body>
</html>
