<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ksign — install</title>
  <style>
    body { background:#0a0a0c; color:#e8e8ec; font-family:-apple-system,system-ui,sans-serif;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; }
    .card { max-width:420px; width:100%; background:#121216; border:1px solid #232329;
            border-radius:16px; padding:36px 28px; }
    .icon { width:64px; height:64px; border-radius:16px;
            background:linear-gradient(135deg,#4f7cff,#8b5cf6);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 20px; font-size:28px; font-weight:700; color:#fff; }
    h1 { text-align:center; font-size:24px; margin:0 0 8px; font-weight:600; }
    p { text-align:center; color:#8a8a94; font-size:14px; margin:0 0 28px; line-height:1.5; }
    a.install { display:block; text-align:center; padding:16px; border-radius:10px;
                background:#4f7cff; color:#fff; text-decoration:none;
                font-weight:600; font-size:15px; }
    a.install:active { background:#6a92ff; }
    .warn { text-align:center; font-size:11px; color:#f5a623; margin-top:20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">k</div>
    <h1>ksign</h1>
    <p>Install the signed app on this iPhone.</p>
    <a class="install" href="itms-services://?action=download-manifest&url=https://ksigncertinstall.netlify.app/ksign.plist">
      Install ksign
    </a>
    <p class="warn">Open in Safari. Chrome/Firefox cannot install iOS apps.</p>
  </div>
</body>
</html>
